name: Service CI (Node)

# GENERATED by tools/gen-service-ci.py - do not edit; change the stand-alone workflow or the generator and run the generator.
#
# The pull-request pipeline of a Node app repository, flat: every job is in this file and nothing is called from here, so the Actions graph shows
# exactly what runs, left to right, with plain names (`ci / Build`):
#
#   Detect changes | Secret scan | Workflow lint | Docs check   (no needs: start at t=0)
#   Lint | Proto check | Shell check | Build | Tests | Integration tests | Dependency scan | Code scan | Image build and scan
#            (need only `Detect changes`; a docs-only change skips them, the guards still run)
#   gate     (needs every job, always runs, names the job that failed first)
#
# The left column means "starts at t=0", not "must pass first": a failed guard does not hide the results of the checks.
# `ci / gate` is the ONLY required check.
# The optional smoke test (input smoke-port) is a step of Build: no extra job, and it reuses the build.
#
# Call it with:  uses: platform-boutique/platform-demo-workflows/.github/workflows/service-ci-node.yaml@<sha> # <tag>
# The calling job must grant: contents: read and packages: write (the image job pushes the tree image).

on:
  workflow_call:
    inputs:
      image:
        description: Build the image and scan it (when code changed). false for a repository without an image pipeline.
        type: boolean
        default: true
      context:
        description: Docker build context
        type: string
        default: .
      dockerfile:
        description: Dockerfile name inside the context
        type: string
        default: Dockerfile
      trivyignores:
        description: Path to a .trivyignore file in the caller repo (optional)
        type: string
        default: ""
      proto-dir:
        description: Directory with the .proto files (the buf module root). Empty looks for proto, src/main/proto and src/protos; a repository without any skips the Proto check.
        type: string
        default: ""
      proto-lint-enforce:
        description: Fail the Proto check on buf lint findings (MINIMAL rules without PACKAGE_DIRECTORY_MATCH). false = report only, the findings are in the run summary.
        type: boolean
        default: false
      proto-breaking-enforce:
        description: Fail the Proto check when the pull request breaks the wire contract of the default branch (buf breaking, FILE rules). false = report only.
        type: boolean
        default: true
      shellcheck-enforce:
        description: Fail the Shell check on shellcheck findings in the tracked *.sh files. false = report only, the findings are in the run summary.
        type: boolean
        default: false
      node-version-file:
        type: string
        default: .nvmrc
      semgrep-config:
        type: string
        default: p/typescript p/nodejs p/secrets
      smoke-port:
        description: gRPC port for a start-the-server health smoke test; empty skips the smoke test
        type: string
        default: ""
      smoke-command:
        description: Command that starts the built server (run after the build)
        type: string
        default: node dist/server.js
      smoke-health-args:
        description: Extra grpcurl arguments for the health check (no reflection, so point at the proto)
        type: string
        default: -import-path ./proto -proto health.proto
      smoke-script:
        description: Optional script in the caller repo for service-specific checks (gets GRPCURL and SMOKE_PORT)
        type: string
        default: ""
      integration-command:
        description: Shell command that runs the integration tests (TEST-02), run from the repository root after the toolchain is set up and the dependencies are installed; Docker is available for throwaway containers. Empty (default) = no Integration tests job runs.
        type: string
        default: ""

# Least privilege by default; every job below declares what it needs.
permissions: {}

jobs:
  changes:
    name: "Detect changes"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # a pull request's merge commit and both its parents; a push's commit and its parent
          persist-credentials: false

      - name: Compare with the base
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          is_docs() {
            case "$1" in
              *.md|docs/*|mkdocs.yml|catalog-info.yaml|.github/dependabot.yml|CODEOWNERS|.github/CODEOWNERS|LICENSE|LICENSE.*|.github/ISSUE_TEMPLATE/*) return 0 ;;
            esac
            return 1
          }

          files=()        # every changed file, once the comparison got that far
          first_code=""   # the first of them that is not documentation or metadata
          workflows=0     # 1 when a workflow file or a local action is part of the change
          skipped="Tests, scans and the image build are skipped."

          # A file name is untrusted text. For the log and the summary: printable ASCII only (anything else becomes ?), no backtick
          # (so it cannot leave its code span), at most 200 characters.
          safe() { printf '%s' "$1" | LC_ALL=C tr -c '\040-\176' '?' | tr '`' "'" | cut -c1-200; }

          write_summary() { # write_summary <true|false> <reason>
            local n=${#files[@]} i
            {
              echo "### What changed"
              echo
              if [ "$1" = false ]; then
                echo "**Documentation only.** $skipped"
              elif [ -n "$first_code" ]; then
                echo "**Code changed.** \`$(safe "$first_code")\` is not documentation or metadata, so everything runs."
              else
                echo "**Treated as a code change.** Reason: $2."
              fi
              if [ "$n" -gt 0 ]; then
                echo
                echo "$n changed file$([ "$n" -eq 1 ] || echo s)."
              fi
              if [ "$EVENT_NAME" = pull_request ] && [ "$workflows" = 1 ]; then
                echo
                echo "**Workflow files are part of this change.** Approving the merge includes them: read them first."
              fi
              if [ "$n" -gt 0 ]; then
                echo
                echo "<details><summary>Changed files ($n)</summary>"
                echo
                for ((i = 0; i < n && i < 50; i++)); do
                  echo "- \`$(safe "${files[$i]}")\`"
                done
                if [ "$n" -gt 50 ]; then echo "- and $((n - 50)) more"; fi
                echo
                echo "</details>"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }

          decide() { # decide <true|false> <reason>
            echo "code=$1" >> "$GITHUB_OUTPUT"
            write_summary "$1" "$2"
            echo "code=$1 ($2)"
            exit 0
          }

          case "$EVENT_NAME" in
            pull_request)
              parents=$(git rev-list --parents -n 1 HEAD | wc -w)
              [ "$parents" -eq 3 ] || decide true "HEAD is not a merge commit; assuming code"
              base=HEAD^1
              ;;
            push)
              base=""
              if [ -n "$BEFORE_SHA" ] && [ "${BEFORE_SHA//0/}" != "" ]; then
                git cat-file -e "${BEFORE_SHA}^{commit}" 2> /dev/null || git fetch --no-tags --depth=1 origin "$BEFORE_SHA" || true
                git cat-file -e "${BEFORE_SHA}^{commit}" 2> /dev/null && base="$BEFORE_SHA"
              fi
              [ -n "$base" ] || { git rev-parse --verify --quiet HEAD^1 > /dev/null && base=HEAD^1; }
              [ -n "$base" ] || decide true "no earlier commit to compare with"
              ;;
            *)
              decide true "manual or scheduled run: everything runs"
              ;;
          esac

          while IFS= read -r -d '' file; do
            files+=("$file")
            case "$file" in .github/workflows/* | .github/actions/*) workflows=1 ;; esac
            if [ -z "$first_code" ] && ! is_docs "$file"; then
              first_code=$file
            fi
          done < <(git diff -z --name-only --no-renames "$base" HEAD)

          total=${#files[@]}
          [ "$total" -gt 0 ] || decide true "empty change"
          [ -z "$first_code" ] || decide true "first code file: $(safe "$first_code")"
          decide false "$total file(s) changed, all documentation or metadata"

  secret-scan:
    name: "Secret scan"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull request: depth 2 is enough to reach both parents of the merge commit; anything else (manual run): full history
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # the open-source CLI, not gitleaks-action: the Action needs a paid license in organisation-owned repositories
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            # Pull request: scan only its commits (BASE..HEAD) without cloning the whole history. Make sure both ends exist, then
            # deepen until they share an ancestor (the range is then complete); give up and fetch everything after 10 rounds.
            for sha in "$BASE_SHA" "$HEAD_SHA"; do
              git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags --depth=2 origin "$sha"
            done
            rounds=0
            until git merge-base "$BASE_SHA" "$HEAD_SHA" > /dev/null 2>&1; do
              rounds=$((rounds + 1))
              if [ "$rounds" -gt 10 ]; then
                git fetch --no-tags --unshallow origin || true
                break
              fi
              git fetch --no-tags --deepen=50 origin "$BASE_SHA" "$HEAD_SHA"
            done
            gitleaks git --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}"   # the pull request's commits
          else
            gitleaks git --redact --verbose                                           # manual run: the whole history
          fi

  workflow-lint:
    name: "Workflow lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every action and reusable workflow is pinned to a commit SHA
        run: |
          shopt -s nullglob
          files=(.github/workflows/*.y*ml .github/actions/*/action.y*ml)
          [ ${#files[@]} -gt 0 ] || exit 0
          unpinned=$(grep -nE '^[[:space:]-]*uses:[[:space:]]*[^./[:space:]]' "${files[@]}" | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [ -n "$unpinned" ]; then
            echo "::error::These references are not pinned to a full commit SHA:"
            echo "$unpinned"
            exit 1
          fi

      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
          ./actionlint -color

  docs:
    name: "Docs check"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      present: ${{ steps.site.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Look for mkdocs.yml
        id: site
        run: |
          set -euo pipefail
          if [ -f mkdocs.yml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no mkdocs.yml in this repository: nothing to check"
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.site.outputs.present == 'true'
        with:
          python-version: "3.13"

      - name: Install mkdocs
        if: steps.site.outputs.present == 'true'
        run: pip install --quiet --disable-pip-version-check mkdocs==1.6.1 mkdocs-techdocs-core==1.7.1

      - name: Build the docs (mkdocs build --strict)
        id: build
        if: steps.site.outputs.present == 'true'
        run: mkdocs build --strict --site-dir "$RUNNER_TEMP/site"

      - name: Check relative markdown links
        id: links
        if: ${{ !cancelled() && steps.site.outputs.present == 'true' }}
        run: |
          python3 -I - . <<'PY'
          #!/usr/bin/env python3
          """Markdown link check of an app repository (DOC-12): every relative link of README.md and of the pages under docs/ must point to
          a file or directory that exists. Python 3 standard library only.

          usage: check-md-links.py [repo-dir]       (default: the current directory)    exit 1 and one line per broken link

            * checked: inline links and images `[text](path)`, reference definitions `[id]: path`; the path is resolved against the directory
              of the page that holds the link (a path that starts with `/` against the repository root, as GitHub does);
            * not checked: http(s)/mailto/... links (they need the network and fail for reasons that are not the repository's), `#anchors`
              (the heading slugs of GitHub and of mkdocs differ), links with a `{{ template }}`;
            * code is not text: fenced code blocks and inline code spans are skipped;
            * the pages are README.md and every `*.md` under `docs_dir` of mkdocs.yml (default `docs`).

          This file is the single source: tools/gen-service-ci.py puts it into the `Docs check` job of service-ci-<language>.yaml as written
          here, and tools/test-md-links.py tests it.
          """
          import os, re, sys
          from urllib.parse import unquote

          root = os.path.abspath(sys.argv[1] if len(sys.argv) > 1 else ".")

          docs_dir = "docs"
          if os.path.isfile(os.path.join(root, "mkdocs.yml")):
              with open(os.path.join(root, "mkdocs.yml"), encoding="utf-8") as f:
                  m = re.search(r"^docs_dir:\s*['\"]?([^'\"\s#]+)", f.read(), re.M)
              if m:
                  docs_dir = m.group(1).rstrip("/")

          pages = []
          if os.path.isfile(os.path.join(root, "README.md")):
              pages.append("README.md")
          for base, dirs, files in os.walk(os.path.join(root, docs_dir)):
              dirs[:] = sorted(d for d in dirs if not d.startswith("."))
              pages += [os.path.relpath(os.path.join(base, n), root) for n in sorted(files) if n.endswith(".md")]

          INLINE = re.compile(r"!?\[[^\]]*\]\(\s*(<[^>]*>|[^)\s]*)(?:\s+(?:\"[^\"]*\"|'[^']*'))?\s*\)")
          REFDEF = re.compile(r"^ {0,3}\[[^\]]+\]:\s*(<[^>]*>|\S+)")
          SCHEME = re.compile(r"^[A-Za-z][A-Za-z0-9+.-]*:")
          FENCE = re.compile(r"^ {0,3}(```|~~~)")

          broken, checked = [], 0
          for page in pages:
              with open(os.path.join(root, page), encoding="utf-8", errors="replace") as f:
                  lines = f.read().split("\n")
              fence = None
              for n, line in enumerate(lines, 1):
                  m = FENCE.match(line)
                  if m:
                      if fence is None:
                          fence = m.group(1)
                      elif m.group(1) == fence:
                          fence = None
                      continue
                  if fence is not None:
                      continue
                  text = re.sub(r"`[^`]*`", "", line)
                  targets = [t for t in INLINE.findall(text)]
                  r = REFDEF.match(text)
                  if r:
                      targets.append(r.group(1))
                  for t in targets:
                      t = t.strip("<>")
                      if not t or t.startswith("#") or SCHEME.match(t) or t.startswith("//") or "{{" in t:
                          continue
                      path = unquote(re.split(r"[#?]", t, 1)[0])
                      if not path:
                          continue
                      full = os.path.join(root, path.lstrip("/")) if path.startswith("/") else os.path.join(root, os.path.dirname(page), path)
                      checked += 1
                      if not os.path.exists(os.path.normpath(full)):
                          broken.append((page, n, t))

          for page, n, t in broken:
              print(f"::error file={page},line={n}::broken link: {t}")
              print(f"{page}:{n}: broken link -> {t}")
          print(f"markdown links: {checked} relative links in {len(pages)} pages, {len(broken)} broken")
          sys.exit(1 if broken else 0)
          PY

      - name: Write the docs summary
        if: ${{ !cancelled() }}
        env:
          PRESENT: ${{ steps.site.outputs.present }}
          BUILD: ${{ steps.build.outcome }}
          LINKS: ${{ steps.links.outcome }}
        run: |
          set -euo pipefail
          words() { case "$1" in success) echo passed ;; failure) echo "**failed**" ;; skipped) echo "not run" ;; *) echo "not run" ;; esac; }
          {
            echo "### Docs check"
            echo
            if [ "$PRESENT" != true ]; then
              echo "This repository has no \`mkdocs.yml\`, so there is nothing to check."
            else
              echo "| | |"
              echo "|---|---|"
              echo "| \`mkdocs build --strict\` | $(words "$BUILD") |"
              echo "| relative links in README.md and docs/ | $(words "$LINKS") |"
              echo
              echo "External links and \`#anchors\` are not checked. The details are in the log of each step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: "Lint"
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  proto:
    name: "Proto check"
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Look for proto files
        id: site
        env:
          PROTO_DIR: ${{ inputs.proto-dir }}
        run: |
          set -euo pipefail
          dir=$PROTO_DIR
          case "$dir" in
            *[!A-Za-z0-9._/-]* | /* | *..*)
              echo "::error::input proto-dir must be a relative path of letters, digits, . _ - and /"
              exit 1
              ;;
          esac
          if [ -n "$dir" ]; then
            if [ -z "$(git ls-files -- "$dir" | grep '\.proto$' || true)" ]; then
              echo "::error::input proto-dir is '$dir', which has no tracked .proto file"
              exit 1
            fi
          else
            for candidate in proto src/main/proto src/protos; do
              if [ -n "$(git ls-files -- "$candidate" | grep '\.proto$' || true)" ]; then dir=$candidate; break; fi
            done
          fi
          if [ -z "$dir" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            if [ -n "$(git ls-files -- '*.proto' | head -1)" ]; then
              echo "other=true" >> "$GITHUB_OUTPUT"
              echo "::warning::.proto files exist outside proto, src/main/proto or src/protos; set the input proto-dir to check them"
            else
              echo "no .proto file in this repository: nothing to check"
            fi
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "proto directory: $dir"

      - name: Check out the default branch (to compare against)
        if: steps.site.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: base
          persist-credentials: false

      - name: Install buf
        if: steps.site.outputs.present == 'true'
        env:
          BUF_VERSION: "1.75.0"
          BUF_SHA256: "fad1e38d6909bbb583a4da81d8c02a01046e2cd663bde7e337dd24277393764b"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/buf" "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          echo "${BUF_SHA256}  $RUNNER_TEMP/buf" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/buf" /usr/local/bin/buf
          buf --version

      - name: Lint the proto files (buf lint)
        id: lint
        if: steps.site.outputs.present == 'true'
        env:
          PROTO_DIR: ${{ steps.site.outputs.dir }}
          LINT_CONFIG: '{"version":"v1","lint":{"use":["MINIMAL"],"except":["PACKAGE_DIRECTORY_MATCH"]}}'
          ENFORCE: ${{ inputs.proto-lint-enforce }}
        run: |
          set -uo pipefail
          rc=0
          buf lint "$PROTO_DIR" --config "$LINT_CONFIG" > "$RUNNER_TEMP/buf-lint.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/buf-lint.txt"
          case "$rc" in
            0) echo "result=passed" >> "$GITHUB_OUTPUT" ;;
            100)
              echo "result=findings" >> "$GITHUB_OUTPUT"
              n=$(grep -c . "$RUNNER_TEMP/buf-lint.txt" || true)
              if [ "$ENFORCE" = true ]; then
                echo "::error::buf lint: $n finding(s)"
                exit 1
              fi
              echo "::warning::buf lint: $n finding(s). Report only (input proto-lint-enforce is false); the list is in the run summary."
              ;;
            *)
              echo "result=error" >> "$GITHUB_OUTPUT"
              echo "::error::buf lint did not run (exit $rc)"
              exit 1
              ;;
          esac

      - name: Check the contract of the default branch (buf breaking)
        id: breaking
        if: ${{ !cancelled() && steps.site.outputs.present == 'true' }}
        env:
          PROTO_DIR: ${{ steps.site.outputs.dir }}
          BREAKING_CONFIG: '{"version":"v1","breaking":{"use":["FILE"]}}'
          ENFORCE: ${{ inputs.proto-breaking-enforce }}
        run: |
          set -uo pipefail
          base="base/$PROTO_DIR"
          if [ -z "$(find "$base" -name '*.proto' -print -quit 2>/dev/null)" ]; then
            echo "result=new" >> "$GITHUB_OUTPUT"
            echo "the default branch has no .proto file in $PROTO_DIR: nothing to compare against"
            exit 0
          fi
          rc=0
          buf breaking "$PROTO_DIR" --against "$base" --config "$BREAKING_CONFIG" > "$RUNNER_TEMP/buf-breaking.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/buf-breaking.txt"
          case "$rc" in
            0) echo "result=passed" >> "$GITHUB_OUTPUT" ;;
            100)
              echo "result=findings" >> "$GITHUB_OUTPUT"
              n=$(grep -c . "$RUNNER_TEMP/buf-breaking.txt" || true)
              if [ "$ENFORCE" = true ]; then
                echo "::error::buf breaking: $n change(s) break the wire contract of the default branch. Proto changes are additive only (new fields, new RPCs)."
                exit 1
              fi
              echo "::warning::buf breaking: $n change(s) break the wire contract of the default branch. Report only (input proto-breaking-enforce is false)."
              ;;
            *)
              echo "result=error" >> "$GITHUB_OUTPUT"
              echo "::error::buf breaking did not run (exit $rc)"
              exit 1
              ;;
          esac

      - name: Write the proto summary
        if: ${{ !cancelled() }}
        env:
          PRESENT: ${{ steps.site.outputs.present }}
          OTHER: ${{ steps.site.outputs.other }}
          PROTO_DIR: ${{ steps.site.outputs.dir }}
          LINT: ${{ steps.lint.outputs.result }}
          BREAKING: ${{ steps.breaking.outputs.result }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          words() {
            case "$1" in
              passed) echo passed ;;
              findings) echo "$2" ;;
              new) echo "nothing to compare: the default branch has no proto here" ;;
              error) echo "**did not run**" ;;
              *) echo "not run" ;;
            esac
          }
          show() { # show <file> <heading>: the findings, at most 40 lines
            [ -s "$1" ] || return 0
            echo
            echo "$2"
            echo
            echo '```'
            head -n 40 "$1"
            [ "$(wc -l < "$1")" -le 40 ] || echo "... (the log of the step has the rest)"
            echo '```'
          }
          {
            echo "### Proto check"
            echo
            if [ "$PRESENT" != true ]; then
              echo "This repository has no .proto file in proto, src/main/proto or src/protos, so there is nothing to check."
              [ "$OTHER" != true ] || echo "It has .proto files elsewhere: set the input \`proto-dir\` to check them."
            else
              echo "Directory: \`$PROTO_DIR\`. buf 1.75.0, inline config (the MINIMAL lint rules without PACKAGE_DIRECTORY_MATCH, the FILE breaking rules); a \`buf.yaml\` in the repository is not used."
              echo
              echo "| | |"
              echo "|---|---|"
              echo "| \`buf lint\` | $(words "$LINT" "findings, report only (input \`proto-lint-enforce\`)") |"
              echo "| \`buf breaking\` against \`$DEFAULT_BRANCH\` | $(words "$BREAKING" "**breaks the contract of the default branch**") |"
              [ "$LINT" != findings ] || show "$RUNNER_TEMP/buf-lint.txt" "buf lint:"
              [ "$BREAKING" != findings ] || show "$RUNNER_TEMP/buf-breaking.txt" "buf breaking:"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  shell:
    name: "Shell check"
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Look for shell scripts
        id: site
        run: |
          set -euo pipefail
          n=$(git ls-files -- '*.sh' | wc -l)
          if [ "$n" -gt 0 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "$n shell script(s)"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no tracked *.sh file in this repository: nothing to check"
          fi

      - name: Install shellcheck
        if: steps.site.outputs.present == 'true'
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/shellcheck.tar.xz" "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/shellcheck"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP/shellcheck" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | head -2

      - name: Run shellcheck
        id: shellcheck
        if: steps.site.outputs.present == 'true'
        env:
          ENFORCE: ${{ inputs.shellcheck-enforce }}
        run: |
          set -uo pipefail
          mapfile -d '' files < <(git ls-files -z -- '*.sh')
          rc=0
          shellcheck -x --format=gcc -- "${files[@]}" > "$RUNNER_TEMP/shellcheck.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/shellcheck.txt"
          case "$rc" in
            0) echo "result=passed" >> "$GITHUB_OUTPUT" ;;
            1)
              echo "result=findings" >> "$GITHUB_OUTPUT"
              n=$(grep -c . "$RUNNER_TEMP/shellcheck.txt" || true)
              level=warning
              [ "$ENFORCE" != true ] || level=error
              # one annotation per finding on the line it is about (the gcc format: file:line:col: level: message [SCnnnn])
              while IFS= read -r line; do
                if [[ "$line" =~ ^(.+):([0-9]+):([0-9]+):\ [a-z]+:\ (.*)$ ]]; then
                  echo "::$level file=${BASH_REMATCH[1]},line=${BASH_REMATCH[2]},col=${BASH_REMATCH[3]}::${BASH_REMATCH[4]}"
                fi
              done < "$RUNNER_TEMP/shellcheck.txt"
              if [ "$ENFORCE" = true ]; then
                echo "::error::shellcheck: $n finding(s)"
                exit 1
              fi
              echo "::warning::shellcheck: $n finding(s). Report only (input shellcheck-enforce is false); the list is in the run summary."
              ;;
            *)
              echo "result=error" >> "$GITHUB_OUTPUT"
              echo "::error::shellcheck did not run cleanly (exit $rc)"
              exit 1
              ;;
          esac

      - name: Write the shell summary
        if: ${{ !cancelled() }}
        env:
          PRESENT: ${{ steps.site.outputs.present }}
          RESULT: ${{ steps.shellcheck.outputs.result }}
        run: |
          set -uo pipefail
          {
            echo "### Shell check"
            echo
            if [ "$PRESENT" != true ]; then
              echo "This repository has no tracked \`*.sh\` file, so there is nothing to check."
            else
              echo "shellcheck 0.11.0 on every tracked \`*.sh\` file (default severity, \`-x\`)."
              echo
              case "$RESULT" in
                passed) echo "Result: passed." ;;
                findings)
                  echo "Result: **findings**, report only (input \`shellcheck-enforce\`):"
                  echo
                  echo '```'
                  head -n 40 "$RUNNER_TEMP/shellcheck.txt"
                  [ "$(wc -l < "$RUNNER_TEMP/shellcheck.txt")" -le 40 ] || echo "... (the log of the step has the rest)"
                  echo '```'
                  ;;
                *) echo "Result: **did not run**." ;;
              esac
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: "Build"
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install grpcurl
        if: inputs.smoke-port != ''
        env:
          VERSION: 1.9.4
          SHA256: 97e13d58d2733a0e62cd2571d1d5f0c02823f0d25282f08bddedf1ad9c5d1736
        run: |
          curl -fsSL -o grpcurl.tgz "https://github.com/fullstorydev/grpcurl/releases/download/v${VERSION}/grpcurl_${VERSION}_linux_x86_64.tar.gz"
          echo "${SHA256}  grpcurl.tgz" | sha256sum -c -
          tar -xzf grpcurl.tgz -C "$RUNNER_TEMP" grpcurl

      - name: Start server and check gRPC health
        if: inputs.smoke-port != ''
        env:
          SMOKE_PORT: ${{ inputs.smoke-port }}
          SMOKE_COMMAND: ${{ inputs.smoke-command }}
          HEALTH_ARGS: ${{ inputs.smoke-health-args }}
          SMOKE_SCRIPT: ${{ inputs.smoke-script }}
        run: |
          export GRPCURL="$RUNNER_TEMP/grpcurl"
          read -ra server_cmd <<< "$SMOKE_COMMAND"
          read -ra health_args <<< "$HEALTH_ARGS"
          PORT="$SMOKE_PORT" "${server_cmd[@]}" &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 2
          response=$("$GRPCURL" -plaintext "${health_args[@]}" "localhost:${SMOKE_PORT}" grpc.health.v1.Health/Check)
          status=$(echo "$response" | grep -o '"status": "[^"]*"' | cut -d'"' -f4)
          if [ "$status" != "SERVING" ]; then
            echo "FAIL: expected SERVING, got '$status'"
            exit 1
          fi
          echo "PASS: service is SERVING"
          if [ -n "$SMOKE_SCRIPT" ]; then
            bash "$SMOKE_SCRIPT"
          fi

  test:
    name: "Tests"
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: |
          # TEST-06: when the repository's test:ci script runs jest, jest also prints the coverage (nothing to install, no threshold);
          # any other runner is left as it is
          if npm pkg get "scripts.test:ci" | grep -q jest; then
            npm run test:ci -- --coverage --coverageReporters=text-summary --coverageReporters=text
          else
            npm run test:ci
          fi

  integration:
    name: "Integration tests"
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' && inputs.integration-command != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the integration tests
        env:
          COMMAND: ${{ inputs.integration-command }}
        run: |
          bash -euo pipefail -c "$COMMAND"

  sca:
    name: "Dependency scan"
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        # audit-level=high: fail only on high/critical findings
        run: npm audit --audit-level=high --omit=dev

  sast:
    name: "Code scan"
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Semgrep
        env:
          VERSION: 1.180.0
        run: pip install "semgrep==${VERSION}"

      - name: Run Semgrep
        env:
          SEMGREP_CONFIG: ${{ inputs.semgrep-config }}
        run: |
          read -ra rules <<< "$SEMGREP_CONFIG"
          args=()
          for rule in "${rules[@]}"; do
            args+=(--config "$rule")
          done
          semgrep scan "${args[@]}" --error --metrics=off

  image:
    name: "Image build and scan"
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' && inputs.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # pushes ghcr.io/<repo>:tree-<hash> for a run that may (same repository, not Dependabot); a fork's token is read-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide whether this run pushes the image
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ACTOR: ${{ github.actor }}
        run: |
          # A run pushes the image to ghcr.io only when its token may: a pull request from a fork has a read-only token, and so has one that
          # Dependabot opened. Those runs build into the local Docker daemon and scan that (nothing is pushed, nothing is reused).
          push=true
          if [ "$EVENT" = pull_request ]; then
            if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ] || [ "$ACTOR" = 'dependabot[bot]' ]; then
              push=false
            fi
          fi
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "this run pushes the image to ghcr.io: $push"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io (to read the build cache, and to push the image)
        # a run that cannot push only needs the cache, and a cache that cannot be read only makes the build slower: its failed login must not fail the pull request
        continue-on-error: ${{ steps.mode.outputs.push != 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the registry build cache
        id: cache
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/buildcache" >> "$GITHUB_OUTPUT"

      - name: Find an image built from this tree
        id: find
        env:
          CAN_PUSH: ${{ steps.mode.outputs.push }}
        run: |
          set -euo pipefail
          # The image is named after the content it was built from: the git tree of the checked-out commit. A pull request's merge commit
          # and the squash commit that lands on main have the SAME tree when main did not move, so the image the pull request built is the
          # image that gets published; a different tree (main moved, a rebase with other changes) finds nothing and builds.
          tree=$(git rev-parse 'HEAD^{tree}')
          if ! [[ "$tree" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::unexpected tree id '$tree'"
            exit 1
          fi
          tag_ref="ghcr.io/${GITHUB_REPOSITORY,,}:tree-$tree"
          found=false
          digest=""
          note=""
          if [ "$CAN_PUSH" = true ]; then
            manifest="$RUNNER_TEMP/tree-manifest.json"
            err="$RUNNER_TEMP/tree-lookup.err"
            for attempt in 1 2 3; do
              if docker buildx imagetools inspect --raw "$tag_ref" > "$manifest" 2> "$err" && [ -s "$manifest" ]; then
                found=true
                digest="sha256:$(sha256sum "$manifest" | cut -d' ' -f1)"
                break
              fi
              if grep -qiE 'not found|manifest_unknown|name_unknown|404' "$err"; then
                note="no image for this tree yet"
                break
              fi
              # Not a clean "not found" (network, registry hiccup). Building is always safe: what is built is what gets scanned and shipped.
              note="the lookup failed ($(head -c 200 "$err" | tr '\n' ' ')), so the image is built"
              echo "::warning::looking up $tag_ref failed (attempt $attempt of 3): $(head -c 200 "$err" | tr '\n' ' ')"
              sleep $((attempt * 3))
            done
          else
            note="this run cannot push, so nothing can be reused"
          fi
          {
            echo "tree=$tree"
            echo "tag-ref=$tag_ref"
            echo "found=$found"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
          if [ "$found" = true ]; then
            echo "tree $tree: image exists ($digest); no build"
          else
            echo "tree $tree: $note"
          fi

      - name: Name this build (version, commit, time)
        id: buildinfo
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            # the pull request's own head commit, not the merge commit that is checked out (the same value as the revision label)
            commit=$PR_HEAD_SHA
            if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "::error::unexpected pull request number '$PR_NUMBER'"
              exit 1
            fi
            version="0.0.0-pr.$PR_NUMBER"
          else
            commit=$GITHUB_SHA
            version="0.0.0-sha.${commit:0:7}"
          fi
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::unexpected commit '$commit'"
            exit 1
          fi
          build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "version=$version"
            echo "commit=$commit"
            echo "build-time=$build_time"
          } >> "$GITHUB_OUTPUT"
          echo "build-args: SERVICE_VERSION=$version SERVICE_COMMIT=$commit BUILD_TIME=$build_time"

      - name: Build the image
        id: build
        if: steps.find.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: ${{ steps.mode.outputs.push == 'true' }}
          load: ${{ steps.mode.outputs.push != 'true' }}
          tags: ${{ steps.mode.outputs.push == 'true' && steps.find.outputs.tag-ref || 'service-ci-scan:local' }}
          # what the Dockerfile may use (ARG SERVICE_VERSION / SERVICE_COMMIT / BUILD_TIME; an undeclared one is ignored)
          build-args: |
            SERVICE_VERSION=${{ steps.buildinfo.outputs.version }}
            SERVICE_COMMIT=${{ steps.buildinfo.outputs.commit }}
            BUILD_TIME=${{ steps.buildinfo.outputs.build-time }}
          # where it was built (the signature of the published image names the commit that was shipped)
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.buildinfo.outputs.commit }}
            org.opencontainers.image.version=${{ steps.buildinfo.outputs.version }}
            org.opencontainers.image.created=${{ steps.buildinfo.outputs.build-time }}
            io.platform-demo.tree=${{ steps.find.outputs.tree }}
            io.platform-demo.build-run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # a run that pushes the image (same repository, not Dependabot) also refreshes the cache; a fork's or Dependabot's run only reads it
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
          cache-to: ${{ steps.mode.outputs.push == 'true' && format('type=registry,ref={0},mode=max,image-manifest=true,oci-mediatypes=true', steps.cache.outputs.ref) || '' }}

      - name: Record the image to scan
        id: image
        env:
          TREE: ${{ steps.find.outputs.tree }}
          FOUND: ${{ steps.find.outputs.found }}
          FOUND_DIGEST: ${{ steps.find.outputs.digest }}
          PUSH: ${{ steps.mode.outputs.push }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$FOUND" = true ]; then
            how=reused
            digest=$FOUND_DIGEST
          elif [ "$PUSH" = true ]; then
            how=built
            digest=$BUILT_DIGEST
          else
            how=local
            digest=""
          fi
          if [ "$how" = local ]; then
            ref=service-ci-scan:local
          else
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::no valid image digest (got '$digest')"
              exit 1
            fi
            ref="ghcr.io/${GITHUB_REPOSITORY,,}@$digest"
          fi
          {
            echo "ref=$ref"
            echo "digest=$digest"
            echo "how=$how"
          } >> "$GITHUB_OUTPUT"

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # same version, threshold and ignore file as the scan in service-publish.yaml (which scans the same digest again)
          version: v0.76.1
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          trivyignores: ${{ inputs.trivyignores }}

      - name: Write the image summary
        if: ${{ !cancelled() }}
        env:
          TREE: ${{ steps.find.outputs.tree }}
          HOW: ${{ steps.image.outputs.how }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SCAN: ${{ steps.trivy.outcome }}
        run: |
          set -euo pipefail
          {
            echo "### Image"
            echo
            case "$HOW" in
              reused) echo "**Reused.** An image of this source tree already exists, so nothing was built." ;;
              built) echo "**Built** and pushed to the staging registry (ghcr.io)." ;;
              local) echo "**Built locally, not pushed.** This run cannot push (a fork or Dependabot pull request), so nothing is reused or published from it." ;;
              *) echo "**No image was produced.** See the failed step in the log." ;;
            esac
            echo
            echo "| | |"
            echo "|---|---|"
            if [ -n "$TREE" ] && { [ "$HOW" = reused ] || [ "$HOW" = built ]; }; then
              echo "| Tag | \`tree-$TREE\` |"
            fi
            [ -z "$DIGEST" ] || echo "| Digest | \`$DIGEST\` |"
            if [ -n "${SCAN:-}" ]; then
              case "$SCAN" in
                success) echo "| Trivy scan | passed: no HIGH or CRITICAL vulnerabilities |" ;;
                failure) echo "| Trivy scan | **failed**: HIGH or CRITICAL vulnerabilities, or the scan could not run. The table is in the log of the step \"Run Trivy vulnerability scanner\" |" ;;
                *) echo "| Trivy scan | not run |" ;;
              esac
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: "gate"
    needs: [changes, secret-scan, workflow-lint, docs, lint, proto, shell, build, test, integration, sca, sast, image]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed, or was skipped for a reason we know
        env:
          NEEDS: ${{ toJSON(needs) }}
          IMAGE: ${{ inputs.image }}
          INTEGRATION: ${{ inputs.integration-command != '' }}
          CODE: ${{ needs.changes.outputs.code }}
          DOCS: ${{ needs.docs.outputs.present }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ACTOR: ${{ github.actor }}
        run: |
          # Jobs this workflow has, in the order of the graph: the three guards, then the checks (generated per language), and their names.
          guards=" changes secret-scan workflow-lint docs "
          checks=" lint proto shell build test integration sca sast image "
          declare -A names=([changes]="Detect changes" [secret-scan]="Secret scan" [workflow-lint]="Workflow lint" [docs]="Docs check" [lint]="Lint" [proto]="Proto check" [shell]="Shell check" [build]="Build" [test]="Tests" [integration]="Integration tests" [sca]="Dependency scan" [sast]="Code scan" [image]="Image build and scan")

          # Text that does not come from this script (an unknown job id, a result) is shown with letters, digits and . _ - only.
          safe() { printf '%s' "$1" | LC_ALL=C tr -c 'A-Za-z0-9._-' '?' | cut -c1-60; }
          label() { echo "${names[$1]:-$(safe "$1")}"; }
          words() {
            case "$1" in
              success) echo passed ;;
              failure) echo failed ;;
              cancelled) echo cancelled ;;
              skipped) echo skipped ;;
              *) safe "$1" ;;
            esac
          }

          stop() { # stop <message for the log> <heading for the summary>: nothing can be judged
            echo "::error::$1"
            echo "### Blocked: $2" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          case "$IMAGE" in
            true | false) ;;
            *) stop "input image is '$IMAGE', expected true or false" "the input image is neither true nor false" ;;
          esac
          case "$INTEGRATION" in
            true | false) ;;
            *) stop "integration is '$INTEGRATION', expected true or false" "the integration switch is neither true nor false" ;;
          esac

          declare -A result
          unknown=()
          mapfile -t rows < <(jq -r 'to_entries[] | [.key, .value.result] | @tsv' <<< "$NEEDS")
          for row in "${rows[@]}"; do
            IFS=$'\t' read -r job res <<< "$row"
            result[$job]=$res
            [ -n "${names[$job]+x}" ] || unknown+=("$job")
          done
          for job in $guards $checks; do
            [ -n "${result[$job]+x}" ] || stop "job $job is missing from needs" "$(label "$job") is missing from the results the gate received"
          done

          # 1. The cause first: a job that failed or was cancelled. Everything downstream of a failed guard is skipped by GitHub, and
          #    that skip is a consequence, not a finding, so it is not reported as one.
          failed=0
          unexplained=0
          bad_code=0
          causes=()
          for job in $guards $checks "${unknown[@]}"; do
            case "${result[$job]}" in
              failure | cancelled)
                failed=1
                echo "::error::$job ${result[$job]}"
                causes+=("$job")
                ;;
            esac
          done

          # 2. What each job should have done. Guards always succeed. Checks succeed when code changed (the image check only if image is on, the
          #    integration tests only if the caller gave integration-command); otherwise they are skipped: docs-only change, image off, integration
          #    not enabled. Any other result is unexplained.
          declare -A want
          for job in $guards; do want[$job]=success; done
          for job in $checks; do
            on=true
            if [ "$job" = "image" ] && [ "$IMAGE" != "true" ]; then on=false; fi
            if [ "$job" = "integration" ] && [ "$INTEGRATION" != "true" ]; then on=false; fi
            if [ "$CODE" = "true" ] && [ "$on" = "true" ]; then want[$job]=success; else want[$job]=skipped; fi
          done
          if [ "$failed" = 0 ] && [ "$CODE" != "true" ] && [ "$CODE" != "false" ]; then
            echo "::error::change detection gave '$CODE', expected true or false"
            failed=1
            bad_code=1
          fi

          table=""
          first_unexplained=""
          for job in $guards $checks "${unknown[@]}"; do
            res=${result[$job]}
            expected=${want[$job]:-}
            shown_expected=${expected:-(unknown job)}
            printf '%-14s %-10s (expected %s)\n' "$job" "$res" "$shown_expected"
            if [ -z "$expected" ]; then
              cell="$(words "$res") (unknown job)"
            elif [ "$res" = "$expected" ]; then
              cell=$(words "$res")
              if [ "$res" = skipped ]; then
                if [ "$CODE" = "false" ]; then cell="skipped: documentation only"
                elif [ "$job" = "integration" ]; then cell="skipped: not enabled (the input integration-command is empty)"
                else cell="skipped: no image pipeline"; fi
              fi
              if [ "$job" = docs ] && [ "$res" = success ] && [ "$DOCS" = false ]; then cell="passed: no mkdocs.yml, nothing to check"; fi
            elif [ "$failed" = 1 ]; then
              cell=$(words "$res")
            else
              cell="$(words "$res"), expected $(words "$expected")"
            fi
            table+="| $(label "$job") | $cell |"$'\n'
            # Only when nothing failed: otherwise the failure above is the cause and skipped jobs downstream of it are expected.
            if [ "$failed" = 0 ] && [ "$res" != "$expected" ]; then
              echo "::error::$job is '$res', expected '$shown_expected'"
              unexplained=1
              [ -n "$first_unexplained" ] || first_unexplained=$job
            fi
          done

          # 3. The summary: the verdict first, then what changed, the results, and what the Merge button will do.
          blocked=1
          if [ "${#causes[@]}" -gt 0 ]; then
            verdict="Blocked: $(label "${causes[0]}") $(words "${result[${causes[0]}]}")"
            [ "${#causes[@]}" -eq 1 ] || verdict+=" (and $((${#causes[@]} - 1)) more)"
          elif [ "$bad_code" = 1 ]; then
            verdict="Blocked: change detection gave no valid answer"
          elif [ "$unexplained" = 1 ]; then
            verdict="Blocked: $(label "$first_unexplained") ended as $(words "${result[$first_unexplained]}"), which was not expected"
          elif [ "$EVENT" = pull_request ]; then
            verdict="Ready to merge"
            blocked=0
          else
            verdict="All checks passed"
            blocked=0
          fi

          {
            echo "### $verdict"
            echo
            case "$CODE" in
              true) echo "Change: **code**. All checks apply."; echo ;;
              false) echo "Change: **documentation only**. Tests, scans and the image build were skipped."; echo ;;
            esac
            echo "| Job | Result |"
            echo "|---|---|"
            printf '%s' "$table"
            if [ "$EVENT" = pull_request ]; then
              echo
              if [ "$blocked" = 1 ]; then
                echo "Merging is blocked: \`ci / gate\` is the required check. The \`merge\` job does not run after a failed run."
              elif [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] && [ "$ACTOR" != 'dependabot[bot]' ]; then
                publish=""
                [ "$IMAGE" != true ] || publish=" and start Publish"
                echo "**Merge button:** approve the \`merge\` environment on this run page (Review deployments) to squash-merge this pull request${publish}."
                if [ "$IMAGE" = true ] && [ "$CODE" = false ]; then
                  echo "Publish will find only documentation and publish nothing."
                fi
              else
                echo "The \`merge\` job does not run for fork or Dependabot pull requests: use the Merge button on the pull request."
                if [ "$IMAGE" = true ]; then echo "Publish starts from the push to \`main\`."; fi
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $((failed + unexplained))
